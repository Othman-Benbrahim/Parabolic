name: Linux native

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  YTDLP_VERSION: 2026.07.04
  NM3U8DL_VERSION: v0.6.0-beta
  DENO_VERSION: v2.8.0

jobs:
  linux-native:
    name: "Linux native (${{ matrix.variant.arch }})"
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x64
            runner: ubuntu-latest
            runtime: linux-x64
            ytdlp: yt-dlp_linux
            nm3u8dl: linux-x64
            deno: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            runtime: linux-arm64
            ytdlp: yt-dlp_linux_aarch64
            nm3u8dl: linux-arm64
            deno: aarch64
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 blueprint-compiler desktop-file-utils ffmpeg gettext gir1.2-adw-1 libadwaita-1-dev libgtk-4-dev jq
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Download portable media resolvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resources/linux/tools /tmp/nm3u8dl
          curl --fail --location "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/${{ matrix.variant.ytdlp }}" -o resources/linux/tools/yt-dlp
          curl --fail --location "https://github.com/denoland/deno/releases/download/${DENO_VERSION}/deno-${{ matrix.variant.deno }}-unknown-linux-gnu.zip" -o /tmp/deno.zip
          unzip -q /tmp/deno.zip -d resources/linux/tools
          asset_url="$(curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/nilaoda/N_m3u8DL-RE/releases/tags/${NM3U8DL_VERSION}" | jq -r '.assets[] | select(.name | contains("${{ matrix.variant.nm3u8dl }}")) | .browser_download_url' | head -n1)"
          test -n "$asset_url"
          curl --fail --location "$asset_url" -o /tmp/nm3u8dl/archive
          if file /tmp/nm3u8dl/archive | grep -qi 'zip'; then unzip -q /tmp/nm3u8dl/archive -d /tmp/nm3u8dl/extracted; else tar -xf /tmp/nm3u8dl/archive -C /tmp/nm3u8dl; fi
          find /tmp/nm3u8dl -type f -name 'N_m3u8DL-RE' -exec cp {} resources/linux/tools/N_m3u8DL-RE \;
          chmod +x resources/linux/tools/yt-dlp resources/linux/tools/N_m3u8DL-RE resources/linux/tools/deno
      - name: Validate cross-platform bridge sources
        run: python3 tests/cross-platform/native-bridge-source-smoke.py
      - name: Build native package
        run: |
          chmod +x resources/linux/package-native.sh resources/linux/install-native.sh resources/linux/uninstall-native.sh
          resources/linux/package-native.sh "${{ matrix.variant.runtime }}" "${{ matrix.variant.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Parabolic-2026.8.6-linux-${{ matrix.variant.arch }}
          path: dist/Parabolic-2026.8.6-linux-${{ matrix.variant.arch }}.tar.gz
          if-no-files-found: error
