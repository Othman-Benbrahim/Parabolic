<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parabolic Media Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Parabolic</h1>
        <p>Downloads and diagnostics</p>
      </div>
      <button id="settingsButton" class="icon-button" type="button" title="Settings" aria-label="Open settings">⚙</button>
    </header>

    <section class="bridge-card" aria-live="polite">
      <span id="bridgeDot" class="bridge-dot"></span>
      <div>
        <strong id="bridgeTitle">Checking Parabolic…</strong>
        <span id="bridgeDetails">Looking for the Firefox native bridge</span>
      </div>
    </section>

    <section id="pageSection" class="page-section">
      <div class="page-copy">
        <strong id="pageTitle">Current page</strong>
        <span id="pageHost"></span>
      </div>
      <button id="downloadPageButton" class="primary-button" type="button">Quick download</button>
    </section>

    <section class="tool-section">
      <div class="tool-heading">
        <strong>Direct HTTP link</strong>
        <button id="pasteUrlButton" class="text-button" type="button">Paste</button>
      </div>
      <div class="input-action-row">
        <input id="directUrlInput" type="url" inputmode="url" placeholder="https://example.com/file.mp4" aria-label="Direct HTTP URL">
        <button id="downloadUrlButton" class="primary-button" type="button">Download</button>
      </div>
    </section>

    <section class="tool-section">
      <div class="tool-heading">
        <strong>RSS subscriptions</strong>
        <button id="checkFeedsButton" class="text-button" type="button">Check now</button>
      </div>
      <div class="input-action-row">
        <input id="feedUrlInput" type="url" inputmode="url" placeholder="https://example.com/feed.xml" aria-label="RSS or Atom feed URL">
        <button id="subscribeButton" class="primary-button" type="button">Follow</button>
      </div>
      <div class="feed-options">
        <input id="feedKeywordInput" type="text" placeholder="Optional keywords: podcast, interview" aria-label="RSS keyword filter">
        <label><input id="feedLatestOnly" type="checkbox" checked> Latest item only</label>
      </div>
      <div id="subscriptionList" class="subscription-list" aria-live="polite"></div>
    </section>

    <div class="section-heading">
      <span id="mediaCount">Detected sources</span>
      <button id="clearButton" class="text-button" type="button">Clear</button>
    </div>

    <section id="mediaList" class="media-list" aria-live="polite"></section>
    <p id="emptyState" class="empty-state" hidden>
      Start playing a video to detect its media streams. The in-player button is now the recommended way to download.
    </p>
    <p id="errorState" class="error-state" hidden></p>
    <p id="statusState" class="status-state" role="status" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
