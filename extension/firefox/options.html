<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parabolic Settings</title>
  <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Parabolic for Firefox</h1>
        <p>In-player downloads and detection preferences</p>
      </div>
      <span id="savedState" class="saved-state" role="status"></span>
    </header>

    <section>
      <h2>In-player button</h2>
      <label class="setting toggle-setting" for="showOverlay">
        <span>
          <strong>Show the download button on videos</strong>
          <small>The button appears automatically over the largest active video.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="showOverlay">
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting" for="quickDownloadPreset">
        <span>
          <strong>One-click quality</strong>
          <small>Used when you click the main half of the video button.</small>
        </span>
        <select id="quickDownloadPreset">
          <option value="best">Best quality</option>
          <option value="1080">Up to 1080p</option>
          <option value="720">Up to 720p</option>
          <option value="480">Up to 480p</option>
          <option value="audio">Audio only</option>
        </select>
      </label>

      <label class="setting" for="overlayPosition">
        <span>
          <strong>Button position</strong>
          <small>Position relative to the detected video.</small>
        </span>
        <select id="overlayPosition">
          <option value="top-right">Top right</option>
          <option value="top-left">Top left</option>
          <option value="bottom-right">Bottom right</option>
          <option value="bottom-left">Bottom left</option>
        </select>
      </label>

      <label class="setting" for="defaultPriority">
        <span>
          <strong>Default download priority</strong>
          <small>High-priority items start before normal and low-priority queued items.</small>
        </span>
        <select id="defaultPriority">
          <option value="high">High</option>
          <option value="normal">Normal</option>
          <option value="low">Low</option>
        </select>
      </label>

      <label class="setting" for="speedLimitKbps">
        <span>
          <strong>Bandwidth limit (KiB/s)</strong>
          <small>Use 0 for unlimited. The limit is attached to each new download.</small>
        </span>
        <input type="number" id="speedLimitKbps" min="0" max="10000000" step="32" inputmode="numeric">
      </label>
    </section>

    <section>
      <h2>Resolvers</h2>
      <label class="setting" for="resolverPreference">
        <span>
          <strong>Resolver strategy</strong>
          <small>Auto uses direct media first, then yt-dlp, with Cobalt as an optional fallback.</small>
        </span>
        <select id="resolverPreference">
          <option value="auto">Automatic</option>
          <option value="yt-dlp">yt-dlp only</option>
          <option value="cobalt">Cobalt</option>
        </select>
      </label>
      <label class="setting" for="cobaltEndpoint">
        <span>
          <strong>Self-hosted Cobalt API</strong>
          <small>Full HTTP(S) endpoint. Leave empty to disable Cobalt.</small>
        </span>
        <input type="url" id="cobaltEndpoint" placeholder="https://cobalt.example/api/">
      </label>
      <label class="setting" for="cobaltAuthScheme">
        <span>
          <strong>Cobalt authentication</strong>
          <small>Match the authentication configured by the instance owner.</small>
        </span>
        <select id="cobaltAuthScheme">
          <option value="none">None</option>
          <option value="api-key">API key</option>
          <option value="bearer">Bearer token</option>
        </select>
      </label>
      <label class="setting" for="cobaltAuthToken">
        <span>
          <strong>Cobalt token</strong>
          <small>Stored only in Firefox local storage and never persisted in Parabolic's recovery queue.</small>
        </span>
        <input type="password" id="cobaltAuthToken" autocomplete="off">
      </label>
    </section>

    <section>
      <h2>Detection</h2>
      <label class="setting toggle-setting" for="detectMedia">
        <span>
          <strong>Detect media playing in Firefox</strong>
          <small>Detect HTML5 video, HLS, DASH and supported embedded players.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="detectMedia">
          <span class="slider"></span>
        </span>
      </label>
      <label class="setting toggle-setting" for="showMediaBadge">
        <span>
          <strong>Show the detected-source counter</strong>
          <small>Keeps diagnostics available on the toolbar icon.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="showMediaBadge">
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <section>
      <h2>Compatibility</h2>
      <label class="setting toggle-setting" for="fallbackToProtocol">
        <span>
          <strong>Open the old Parabolic app if the bridge is missing</strong>
          <small>Disabled by default because this switches focus away from Firefox.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="fallbackToProtocol">
          <span class="slider"></span>
        </span>
      </label>
      <label class="setting toggle-setting" for="showContextMenu">
        <span>
          <strong>Show “Download link with Parabolic”</strong>
          <small>Adds Parabolic to the Firefox right-click menu.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="showContextMenu">
          <span class="slider"></span>
        </span>
      </label>
      <label class="setting toggle-setting" for="trimPlaylist">
        <span>
          <strong>Download only the current YouTube video</strong>
          <small>Removes playlist parameters from YouTube URLs.</small>
        </span>
        <span class="toggle">
          <input type="checkbox" id="trimPlaylist">
          <span class="slider"></span>
        </span>
      </label>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
